<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Swallowtail</title>
<meta name="description" content="Self-improving AI through software-hardware co-learning.">
<link rel="icon" href="swallowtail-mark.svg" type="image/svg+xml">
<meta property="og:title" content="Swallowtail">
<meta property="og:description" content="Self-improving AI through software-hardware co-learning.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://swallowtaillabs.com/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink:   #1A1A1A;
    --slate: #4A5568;
    --cool:  #1E3A5F;
    --pale:  #E8E8E8;
    --paper: #FDFDFC;
    --serif: "EB Garamond", Georgia, "Iowan Old Style", "Times New Roman", serif;
    --sans:  -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif;
    color-scheme: light;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--paper);
    color: var(--ink);
    font: 400 17px/1.65 var(--sans);
    -webkit-font-smoothing: antialiased;
  }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: clamp(3.5rem, 10vh, 6rem) 1.5rem;
  }

  .lockup {
    display: flex;
    align-items: center;
    gap: clamp(0.7rem, 2.4vw, 1.15rem);
  }

  .mark {
    flex: none;
    width: clamp(46px, 10vw, 62px);
    height: auto;
  }

  h1 {
    /* cancels the trailing letter-space so the lockup sits optically centred */
    margin: 0 -0.16em 0 0;
    font-size: clamp(1.9rem, 6vw, 2.6rem);
    font-weight: 600;
    letter-spacing: 0.16em;
    color: var(--cool);
  }

  .tagline {
    max-width: 30rem;
    margin: clamp(1.6rem, 4.5vh, 2.4rem) 0 0;
    font-family: var(--serif);
    font-size: clamp(1.08rem, 2.8vw, 1.3rem);
    line-height: 1.6;
    color: var(--slate);
  }

  /* keep the compound and the term pair from breaking across lines */
  .nb,
  .terms { white-space: nowrap; }

  /* the term being replaced, and its replacement. Both terms stay on the page:
     the strike is the argument. Default state is the resolved one, so a reader
     with animation off sees the finished sentence rather than a half-made point. */

  .was {
    position: relative;
    /* inline-block so the pseudo-elements get a box whose centre is the word's
       centre; on a bare inline element they would centre on the line box */
    display: inline-block;
    margin-right: 0.4em;
    text-decoration: none;
  }

  /* two diagonals crossing at the centre of the word */
  .was::before,
  .was::after {
    content: "";
    position: absolute;
    left: -0.12em;
    right: -0.12em;
    top: 50%;
    height: 1px;
    background: currentColor;
    transform-origin: center;
  }

  .was::before { transform: translateY(calc(-50% + 0.12em)) rotate(12deg)  scaleX(1); }
  .was::after  { transform: translateY(calc(-50% + 0.12em)) rotate(-12deg) scaleX(1); }

  .now {
    color: var(--cool);
    font-weight: 500;
    opacity: 1;
  }

  footer {
    padding: 0 1.5rem clamp(2rem, 6vh, 3rem);
    text-align: center;
    font-size: 0.82rem;
    letter-spacing: 0.02em;
    color: var(--slate);
  }

  @media (prefers-reduced-motion: no-preference) {
    .lockup, .tagline {
      animation: rise 0.8s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    .lockup  { animation-delay: 0s; }
    .tagline { animation-delay: 0.16s; }

    /* Hold on the old term long enough to read it, then cross it out.
       co-learning holds its space from the start, so nothing reflows when it
       lands. The cost is that co-design sits left of centre until then, which
       is why the hold is short. */
    .was::before {
      transform: translateY(calc(-50% + 0.12em)) rotate(12deg) scaleX(0);
      animation: crossA 0.42s cubic-bezier(0.65, 0, 0.35, 1) 1.3s forwards;
    }

    .was::after {
      transform: translateY(calc(-50% + 0.12em)) rotate(-12deg) scaleX(0);
      animation: crossB 0.42s cubic-bezier(0.65, 0, 0.35, 1) 1.5s forwards;
    }

    .now {
      opacity: 0;
      animation: reveal 0.6s cubic-bezier(0.22, 1, 0.36, 1) 1.95s forwards;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: none; }
    }
    @keyframes crossA {
      to { transform: translateY(calc(-50% + 0.12em)) rotate(12deg) scaleX(1); }
    }
    @keyframes crossB {
      to { transform: translateY(calc(-50% + 0.12em)) rotate(-12deg) scaleX(1); }
    }
    @keyframes reveal {
      from { opacity: 0; transform: translateY(4px); }
      to   { opacity: 1; transform: none; }
    }
  }
</style>
</head>
<body>

<main>
  <div class="lockup">
    <img class="mark" src="swallowtail-mark.svg" alt="Swallowtail mark" width="62" height="62">
    <h1>SWALLOWTAIL</h1>
  </div>

  <p class="tagline">Self-improving AI through <span class="nb">software-hardware</span>
  <span class="terms"><s class="was">co-design</s> <span class="now">co-learning</span></span></p>
</main>

<footer>&copy; 2026 Swallowtail Labs, Inc.</footer>

</body>
</html>
